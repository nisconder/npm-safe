<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>npm-safe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- Navigation Drawer (permanent for desktop) -->
      <nav class="nav-drawer">
        <div class="nav-header">
          <div class="nav-logo">npm-safe</div>
          <div class="nav-subtitle">Supply Chain Security</div>
        </div>
        <div class="nav-items">
          <button class="nav-item active" data-tab="overview">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            </span>
            <span class="nav-label">总览</span>
          </button>
          <button class="nav-item" data-tab="check">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            </span>
            <span class="nav-label">检查</span>
          </button>
          <button class="nav-item" data-tab="search">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </span>
            <span class="nav-label">搜索</span>
          </button>
          <button class="nav-item" data-tab="watch">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34-3-3-1.34-3-3-3z"/></svg>
            </span>
            <span class="nav-label">监控</span>
          </button>
          <button class="nav-item" data-tab="rules">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            </span>
            <span class="nav-label">评价体系</span>
          </button>
          <button class="nav-item" data-tab="llm">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2c-3.31 0-6 2.69-6 6 0 2.74 1.86 5.05 4.45 5.86L8 22h8l-1.45-8.14C17.14 13.05 19 10.74 19 8c0-3.31-2.69-6-6-6z"/></svg>
            </span>
            <span class="nav-label">LLM</span>
          </button>
          <button class="nav-item" data-tab="settings">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
            </span>
            <span class="nav-label">设置</span>
          </button>
        </div>
      </nav>

      <div class="app-content">
        <!-- Custom Title Bar -->
        <div class="custom-title-bar" id="title-bar">
          <div class="title-bar-drag" id="title-bar-drag">
            <span class="title-bar-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
            </span>
            <span class="title-bar-text">npm-safe</span>
          </div>
          <div class="title-bar-controls">
            <button class="title-bar-btn" id="theme-toggle" title="切换浅色/深色模式" aria-label="切换主题">
              <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2.5a1 1 0 0 1 1 1v2.2a1 1 0 0 1-2 0V3.5a1 1 0 0 1 1-1zm0 15.8a1 1 0 0 1 1 1v2.2a1 1 0 0 1-2 0v-2.2a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.41 0l1.56 1.56a1 1 0 1 1-1.41 1.41L4.22 5.64a1 1 0 0 1 0-1.42zm13.59 13.59a1 1 0 0 1 1.41 0l1.56 1.56a1 1 0 1 1-1.41 1.41l-1.56-1.56a1 1 0 0 1 0-1.41zM2 12a1 1 0 0 1 1-1h2.2a1 1 0 0 1 0 2H3a1 1 0 0 1-1-1zm15.8 0a1 1 0 0 1 1-1h2.2a1 1 0 0 1 0 2h-2.2a1 1 0 0 1-1-1zM4.22 19.78a1 1 0 0 1 0-1.41l1.56-1.56a1 1 0 1 1 1.41 1.41l-1.56 1.56a1 1 0 0 1-1.41 0zm13.59-13.59a1 1 0 0 1 0-1.41l1.56-1.56a1 1 0 1 1 1.41 1.41l-1.56 1.56a1 1 0 0 1-1.41 0z"/></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
            <button class="title-bar-btn title-bar-window" id="window-minimize" title="最小化" aria-label="最小化">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 11H4v2h16v-2z"/></svg>
            </button>
            <button class="title-bar-btn title-bar-close" id="window-close" title="关闭" aria-label="关闭">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </div>

        <!-- Top App Bar -->
        <header class="top-app-bar">
          <h1 class="top-app-bar-title" id="top-title">总览</h1>
        </header>

        <main class="app-main">
          <!-- Overview / Dashboard -->
          <section id="tab-overview" class="tab-panel active">
            <div class="dashboard-grid">
              <div class="dashboard-card gauge-card">
                <div class="card-title">整体安全评分</div>
                <div class="gauge-wrapper">
                  <svg class="gauge" viewBox="0 0 200 110">
                    <defs>
                      <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--md-error)" />
                        <stop offset="50%" style="stop-color:var(--md-yellow)" />
                        <stop offset="100%" style="stop-color:var(--md-safe)" />
                      </linearGradient>
                    </defs>
                    <path class="gauge-bg" d="M 20 100 A 80 80 0 0 1 180 100" pathLength="100" />
                    <path id="gauge-arc" class="gauge-arc" d="M 20 100 A 80 80 0 0 1 180 100" pathLength="100" />
                    <text id="gauge-value" x="100" y="85" text-anchor="middle" class="gauge-value">0</text>
                    <text id="gauge-label" x="100" y="102" text-anchor="middle" class="gauge-label">等待数据</text>
                  </svg>
                </div>
                <div class="gauge-summary" id="gauge-summary">暂无检查记录</div>
              </div>

              <div class="dashboard-card">
                <div class="card-title">近7日检查</div>
                <div class="stat-number" id="weekly-count">0</div>
                <div class="stat-label">次检查</div>
                <div class="mini-chart" id="weekly-chart"></div>
              </div>

              <div class="dashboard-card">
                <div class="card-title">总检查次数</div>
                <div class="stat-number" id="total-count">0</div>
                <div class="stat-label">次</div>
              </div>

              <div class="dashboard-card">
                <div class="card-title">风险分布</div>
                <div class="risk-bars" id="risk-bars">
                  <div class="risk-bar-row"><span class="risk-dot safe"></span><span>安全</span><span class="risk-count" id="risk-safe">0</span></div>
                  <div class="risk-bar-row"><span class="risk-dot suspicious"></span><span>可疑</span><span class="risk-count" id="risk-suspicious">0</span></div>
                  <div class="risk-bar-row"><span class="risk-dot dangerous"></span><span>危险</span><span class="risk-count" id="risk-dangerous">0</span></div>
                  <div class="risk-bar-row"><span class="risk-dot unknown"></span><span>未知</span><span class="risk-count" id="risk-unknown">0</span></div>
                </div>
              </div>
            </div>

            <div class="dashboard-card recent-card">
              <div class="card-title">最近检查</div>
              <div id="recent-checks" class="recent-list"></div>
            </div>
          </section>

          <!-- Check -->
          <section id="tab-check" class="tab-panel">
            <div class="panel-header">
              <div class="text-field outlined">
                <input id="check-name" type="text" placeholder=" " />
                <label for="check-name">输入包名，例如 lodash</label>
              </div>
              <button id="check-btn" class="btn filled" data-original-text="检查">检查</button>
            </div>
            <div id="check-result" class="result-area"></div>
          </section>

          <!-- Search -->
          <section id="tab-search" class="tab-panel">
            <div class="panel-header">
              <div class="text-field outlined">
                <input id="search-query" type="text" placeholder=" " />
                <label for="search-query">搜索关键词</label>
              </div>
              <div class="text-field outlined size-field">
                <input id="search-size" type="number" value="20" min="1" max="250" placeholder=" " />
                <label for="search-size">数量</label>
              </div>
              <button id="search-btn" class="btn filled" data-original-text="搜索">搜索</button>
            </div>
            <div id="search-result" class="result-area"></div>
          </section>

          <!-- Watchlist -->
          <section id="tab-watch" class="tab-panel">
            <div class="panel-header">
              <div class="text-field outlined">
                <input id="watch-name" type="text" placeholder=" " />
                <label for="watch-name">要监控的包名</label>
              </div>
              <button id="watch-add-btn" class="btn filled" data-original-text="添加">添加</button>
              <button id="watch-refresh-btn" class="btn outlined" data-original-text="刷新全部">刷新全部</button>
            </div>
            <div id="watch-result" class="result-area"></div>
          </section>

          <!-- Rules -->
          <section id="tab-rules" class="tab-panel">
            <div class="panel-header">
              <button id="rules-load-btn" class="btn outlined">重新加载插件</button>
              <span id="rules-summary" class="rules-summary"></span>
            </div>
            <div id="rules-list" class="result-area"></div>
          </section>

          <!-- LLM -->
          <section id="tab-llm" class="tab-panel">
            <div class="card llm-card">
              <div class="card-title">LLM 扫描配置</div>
              <div class="card-row llm-status-row">
                <span>当前状态</span>
                <span id="llm-status-text" class="value">未配置</span>
              </div>
              <div class="form-row switch-row">
                <label class="switch-label">
                  <input type="checkbox" id="llm-enabled" />
                  <span class="switch"></span>
                  <span class="switch-text">启用 LLM 扫描</span>
                </label>
              </div>
              <div class="form-grid">
                <div class="text-field outlined">
                  <select id="llm-provider">
                    <option value="openai">OpenAI</option>
                    <option value="gemini">Gemini</option>
                    <option value="anthropic">Anthropic</option>
                  </select>
                  <label for="llm-provider">提供者</label>
                </div>
                <div class="text-field outlined">
                  <input id="llm-api-key" type="text" placeholder=" " autocomplete="off" />
                  <label for="llm-api-key">API 密钥</label>
                  <div class="field-hint" id="llm-api-key-hint"></div>
                </div>
                <div class="text-field outlined">
                  <input id="llm-model" type="text" placeholder=" " />
                  <label for="llm-model">模型</label>
                </div>
                <div class="text-field outlined">
                  <input id="llm-base-url" type="text" placeholder=" " />
                  <label for="llm-base-url">基础 URL（可选）</label>
                </div>
              </div>
              <div class="form-actions">
                <button id="llm-save-btn" class="btn filled" data-original-text="保存">保存</button>
                <button id="llm-test-btn" class="btn outlined" data-original-text="测试连接">测试连接</button>
                <button id="llm-reset-btn" class="btn text" data-original-text="重置">重置</button>
              </div>
              <div id="llm-result" class="llm-result"></div>
            </div>
          </section>

          <!-- Settings -->
          <section id="tab-settings" class="tab-panel">
            <div class="panel-header">
              <div class="text-field outlined">
                <input id="setting-key" type="text" placeholder=" " />
                <label for="setting-key">键（例如 proxy / lang）</label>
              </div>
              <div class="text-field outlined">
                <input id="setting-value" type="text" placeholder=" " />
                <label for="setting-value">值（例如 http://127.0.0.1:7897）</label>
              </div>
              <button id="setting-get-btn" class="btn outlined" data-original-text="读取">读取</button>
              <button id="setting-set-btn" class="btn filled" data-original-text="写入">写入</button>
            </div>
            <div id="setting-result" class="result-area"></div>
          </section>
        </main>
      </div>
    </div>

    <div id="status-bar" class="status-bar">就绪</div>

    <script src="js/neutralino.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
