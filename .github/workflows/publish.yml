name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (for example: 1.0.6)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  id-token: write   # REQUIRED for npm provenance (OIDC)
  contents: read

jobs:
  publish:
    name: Publish @npm-safe/core to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}" || {
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}." >&2
              exit 1
            }
          else
            test "${REQUESTED_VERSION}" = "${PACKAGE_VERSION}" || {
              echo "Requested version ${REQUESTED_VERSION} does not match package version ${PACKAGE_VERSION}." >&2
              exit 1
            }
          fi

      - name: Run quality gate
        run: pnpm verify

      - name: Verify published files
        run: pnpm pack:check

      - name: Publish to npm
        working-directory: packages/core
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
