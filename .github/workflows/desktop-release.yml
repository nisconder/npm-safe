name: Desktop Release Assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to upload release assets

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-build:
    name: Build & attach desktop GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Neutralinojs binaries
        working-directory: packages/desktop
        run: npx -y @neutralinojs/neu@11.7.2 update

      - name: Build desktop app
        working-directory: packages/desktop
        run: pnpm run build

      - name: List dist artifacts
        working-directory: packages/desktop
        run: ls -la dist/ dist/npm-safe/ || true

      - name: Prepare update assets
        working-directory: packages/desktop
        run: |
          cp dist/npm-safe/resources.neu ./resources.neu
          VERSION="${GITHUB_REF_NAME#v}"
          cat > update_manifest.json <<EOF
          {
            "applicationId": "org.npmsafe.desktop",
            "version": "${VERSION}",
            "resourcesURL": "https://github.com/nisconder/npm-safe/releases/latest/download/resources.neu",
            "data": {}
          }
          EOF
          echo "Generated update_manifest.json:"
          cat update_manifest.json

      - name: Attach release assets
        working-directory: packages/desktop
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.zip resources.neu update_manifest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
