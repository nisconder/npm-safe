name: Desktop Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example: v1.0.6)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to upload release assets

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-build:
    name: Build & attach desktop GUI
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve and verify release version
        shell: bash
        run: |
          CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          DESKTOP_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          test "${CORE_VERSION}" = "${DESKTOP_VERSION}" || {
            echo "Core ${CORE_VERSION} and desktop ${DESKTOP_VERSION} versions differ." >&2
            exit 1
          }
          if [[ "${RELEASE_TAG}" != "v${CORE_VERSION}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${CORE_VERSION}." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${CORE_VERSION}" >> "${GITHUB_ENV}"

      - name: Update Neutralinojs binaries
        working-directory: packages/desktop
        run: npx -y @neutralinojs/neu@11.7.2 update

      - name: Build desktop app
        working-directory: packages/desktop
        run: pnpm run build

      - name: List dist artifacts
        working-directory: packages/desktop
        run: ls -la dist/ dist/npm-safe/ || true

      - name: Prepare update assets
        working-directory: packages/desktop
        run: |
          cp dist/npm-safe/resources.neu ./resources.neu
          cat > update_manifest.json <<EOF
          {
            "applicationId": "org.npmsafe.desktop",
            "version": "${RELEASE_VERSION}",
            "resourcesURL": "https://github.com/nisconder/npm-safe/releases/latest/download/resources.neu",
            "data": {}
          }
          EOF
          echo "Generated update_manifest.json:"
          cat update_manifest.json

      - name: Attach release assets
        working-directory: packages/desktop
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --generate-notes
          fi
          gh release upload "${RELEASE_TAG}" dist/*.zip resources.neu update_manifest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
