<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="安装门禁流程：先检查 npm/pnpm/yarn 安装目标，低于阈值需确认，然后才交给真正的包管理器">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="380" rx="20" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="1279" height="379" rx="19.5" fill="none" stroke="#e2e8f0"/>
  <g font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="64" y="64" font-size="24" font-weight="700" fill="#0f172a">安装门禁：先检查，后安装</text>
    <text x="64" y="94" font-size="16" fill="#64748b">可选、默认关闭。包装器保留你的包管理器与子命令；被检查的版本即被安装的版本。</text>
  </g>
  <g font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="16">
    <g transform="translate(64,150)">
      <rect width="230" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="22" y="42" font-weight="700" fill="#0f172a">你的安装命令</text>
      <text x="22" y="72" font-size="14" fill="#64748b" font-family="'SF Mono',Consolas,monospace">npm install axios</text>
      <text x="22" y="96" font-size="14" fill="#64748b" font-family="'SF Mono',Consolas,monospace">pnpm add · yarn add</text>
    </g>
    <line x1="298" y1="215" x2="356" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(360,150)">
      <rect width="230" height="130" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="22" y="42" font-weight="700" fill="#1d4ed8">npm-safe 检查</text>
      <text x="22" y="72" font-size="14" fill="#64748b">精确的已发布版本</text>
      <text x="22" y="96" font-size="14" fill="#64748b">评分 + 发现项</text>
    </g>
    <line x1="594" y1="215" x2="652" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(656,150)">
      <path d="M115 0 L230 65 L115 130 L0 65 Z" fill="#fffbeb" stroke="#fde68a"/>
      <text x="115" y="58" font-weight="700" fill="#b45309" text-anchor="middle" font-size="15">评分 ≥ 85？</text>
      <text x="115" y="84" fill="#92400e" text-anchor="middle" font-size="13">阈值可配置</text>
    </g>
    <line x1="890" y1="185" x2="960" y2="185" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="898" y="172" font-size="13" fill="#059669">是</text>
    <line x1="890" y1="245" x2="960" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="898" y="232" font-size="13" fill="#b45309">否 → 需确认</text>
    <g transform="translate(964,130)">
      <rect width="252" height="80" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="22" y="34" font-weight="700" fill="#047857">继续安装</text>
      <text x="22" y="60" font-size="14" fill="#64748b">真正的包管理器执行</text>
    </g>
    <g transform="translate(964,230)">
      <rect width="252" height="80" rx="14" fill="#fef2f2" stroke="#fecaca"/>
      <text x="22" y="34" font-weight="700" fill="#b91c1c">拒绝 → 退出码 3</text>
      <text x="22" y="60" font-size="14" fill="#64748b">不安装任何内容</text>
    </g>
    <text x="64" y="342" font-size="14" fill="#94a3b8">npm-safe gate enable 启用 · gate set-threshold 调整阈值 · npm-safe doctor 诊断包装器。</text>
  </g>
</svg>