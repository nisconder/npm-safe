<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">npm-safe DSH 插件安装风险卡</title>
  <desc id="desc">一张中风险 DSH 插件安装预检卡，展示来源固定、生命周期脚本、核心依赖、bundle patch、peer 版本和固定版本命令。</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c1b"/>
      <stop offset="1" stop-color="#111514"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c25d"/>
      <stop offset="1" stop-color="#dba23a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .sans { font-family: "IBM Plex Sans", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: "IBM Plex Mono", "Cascadia Mono", monospace; }
      .muted { fill: #94a09b; }
      .white { fill: #eef4f1; }
      .gold { fill: #efbd57; }
      .green { fill: #68c9a2; }
      .label { font-size: 20px; font-weight: 700; }
      .detail { font-size: 15px; }
      .status { font-size: 14px; font-weight: 700; }
      .section { font-size: 20px; font-weight: 700; }
      .line { stroke: #32403b; stroke-width: 1; }
      .panel { fill: #1a201e; stroke: #34423d; stroke-width: 1.5; }
      .check { fill: none; stroke: #68c9a2; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1440" height="1120" fill="#111316"/>
  <g filter="url(#shadow)">
    <rect x="36" y="28" width="1368" height="1064" rx="24" fill="url(#card)" stroke="#3a4742" stroke-width="2"/>
    <rect x="36" y="28" width="8" height="1064" rx="4" fill="url(#warm)"/>
  </g>

  <!-- Header -->
  <g class="sans">
    <rect x="78" y="67" width="48" height="28" rx="4" fill="#232b28" stroke="#59635f"/>
    <text x="102" y="87" text-anchor="middle" class="mono white" font-size="13" font-weight="700">NPM</text>
    <text x="143" y="87" class="mono muted" font-size="15">npm registry</text>
    <text x="264" y="87" class="mono muted" font-size="15">/</text>
    <text x="286" y="87" class="mono green" font-size="15">查看来源</text>
    <text x="78" y="142" class="mono white" font-size="34" font-weight="700">@example/dsh-workflow-kit</text>
    <text x="78" y="174" class="mono muted" font-size="16">0.8.4</text>

    <rect x="1195" y="61" width="153" height="112" rx="13" fill="#25241c" stroke="#796330" stroke-width="1.5"/>
    <text x="1271" y="87" text-anchor="middle" class="mono gold" font-size="12" font-weight="700" letter-spacing="3">RISK</text>
    <text x="1271" y="125" text-anchor="middle" class="sans gold" font-size="29" font-weight="700">Medium</text>
    <text x="1271" y="151" text-anchor="middle" class="sans gold" font-size="15" font-weight="700">需审查</text>
  </g>

  <line x1="44" y1="205" x2="1404" y2="205" class="line"/>
  <g class="sans">
    <text x="78" y="259" class="mono gold" font-size="39" font-weight="700">72</text>
    <text x="132" y="259" class="mono muted" font-size="15">/100</text>
    <text x="183" y="259" class="sans muted" font-size="16">安全分</text>
    <text x="313" y="256" class="sans white" font-size="20">可以继续评估，但安装前应处理黄色警告。</text>
  </g>
  <line x1="44" y1="296" x2="1404" y2="296" class="line"/>

  <!-- Evidence -->
  <g class="sans">
    <text x="78" y="340" class="section white">DSH 安装契约</text>
    <text x="1348" y="340" text-anchor="end" class="mono muted" font-size="14">7 项证据</text>

    <!-- row 1 -->
    <rect x="78" y="365" width="620" height="82" rx="11" class="panel"/>
    <circle cx="110" cy="406" r="17" fill="#162721" stroke="#4b9e7f" stroke-width="2"/>
    <path d="M102 406l5 5 10-13" class="check"/>
    <text x="143" y="399" class="label white">来源固定</text>
    <text x="143" y="424" class="detail mono muted">@example/dsh-workflow-kit@0.8.4，完整性已验证</text>
    <text x="674" y="411" text-anchor="end" class="status muted">通过</text>

    <rect x="714" y="365" width="634" height="82" rx="11" class="panel"/>
    <circle cx="746" cy="406" r="17" fill="#282315" stroke="#c99737" stroke-width="2"/>
    <text x="746" y="413" text-anchor="middle" class="gold" font-size="21" font-weight="700">!</text>
    <text x="779" y="399" class="label white">生命周期脚本</text>
    <text x="779" y="424" class="detail mono muted">postinstall: node scripts/setup.js</text>
    <text x="1324" y="411" text-anchor="end" class="status muted">注意</text>

    <!-- row 2 -->
    <rect x="78" y="461" width="620" height="82" rx="11" class="panel"/>
    <circle cx="110" cy="502" r="17" fill="#162721" stroke="#4b9e7f" stroke-width="2"/>
    <path d="M102 502l5 5 10-13" class="check"/>
    <text x="143" y="495" class="label white">DSH 核心依赖</text>
    <text x="143" y="520" class="detail muted">未把宿主核心包打进运行时依赖</text>
    <text x="674" y="507" text-anchor="end" class="status muted">通过</text>

    <rect x="714" y="461" width="634" height="82" rx="11" class="panel"/>
    <circle cx="746" cy="502" r="17" fill="#162721" stroke="#4b9e7f" stroke-width="2"/>
    <path d="M738 502l5 5 10-13" class="check"/>
    <text x="779" y="495" class="label white">依赖来源</text>
    <text x="779" y="520" class="detail muted">运行时依赖均使用 registry 版本范围</text>
    <text x="1324" y="507" text-anchor="end" class="status muted">通过</text>

    <!-- row 3 -->
    <rect x="78" y="557" width="620" height="82" rx="11" class="panel"/>
    <circle cx="110" cy="598" r="17" fill="#162721" stroke="#4b9e7f" stroke-width="2"/>
    <path d="M102 598l5 5 10-13" class="check"/>
    <text x="143" y="591" class="label white">Bundle 声明</text>
    <text x="143" y="616" class="detail mono muted">./cordis.patch.yml</text>
    <text x="674" y="603" text-anchor="end" class="status muted">通过</text>

    <rect x="714" y="557" width="634" height="82" rx="11" class="panel"/>
    <circle cx="746" cy="598" r="17" fill="#162721" stroke="#4b9e7f" stroke-width="2"/>
    <path d="M738 598l5 5 10-13" class="check"/>
    <text x="779" y="591" class="label white">Patch 文件</text>
    <text x="779" y="616" class="detail mono muted">./cordis.patch.yml 已包含在发布内容中</text>
    <text x="1324" y="603" text-anchor="end" class="status muted">通过</text>

    <!-- row 4 -->
    <rect x="78" y="653" width="620" height="82" rx="11" class="panel"/>
    <circle cx="110" cy="694" r="17" fill="#162721" stroke="#4b9e7f" stroke-width="2"/>
    <path d="M102 694l5 5 10-13" class="check"/>
    <text x="143" y="687" class="label white">DSH peer 版本</text>
    <text x="143" y="712" class="detail mono muted">^0.1.0-rc.8 包含当前预览基线</text>
    <text x="674" y="699" text-anchor="end" class="status muted">通过</text>
  </g>

  <!-- Findings -->
  <g class="sans">
    <text x="78" y="786" class="section white">需要处理</text>
    <text x="1348" y="786" text-anchor="end" class="mono muted" font-size="14">2 项</text>

    <rect x="78" y="811" width="620" height="119" rx="11" class="panel"/>
    <rect x="96" y="830" width="5" height="80" rx="2.5" fill="#efbd57"/>
    <text x="120" y="844" class="label white">安装时会自动运行脚本</text>
    <text x="120" y="870" class="detail mono muted">postinstall: node scripts/setup.js</text>
    <text x="120" y="902" class="detail muted">建议 · 先审查脚本及其调用文件，再显式允许运行。</text>

    <rect x="714" y="811" width="634" height="119" rx="11" class="panel"/>
    <rect x="732" y="830" width="5" height="80" rx="2.5" fill="#efbd57"/>
    <text x="756" y="844" class="label white">构建步骤需要人工确认</text>
    <text x="756" y="870" class="detail muted">固定版本依赖仍会在首次加载时生成本地文件。</text>
    <text x="756" y="902" class="detail muted">建议 · 使用 --ignore-scripts 安装后再手动构建。</text>
  </g>

  <!-- Command -->
  <g class="sans">
    <rect x="78" y="958" width="1270" height="94" rx="12" fill="#211f19" stroke="#776334" stroke-width="1.5"/>
    <text x="102" y="987" class="label white" font-size="17">固定来源安装命令</text>
    <text x="1319" y="987" text-anchor="end" class="muted" font-size="14">仅复制，不执行</text>
    <rect x="102" y="1000" width="1015" height="36" rx="6" fill="#111413"/>
    <text x="120" y="1024" class="mono white" font-size="16">dsh plugin --profile web add @example/dsh-workflow-kit@0.8.4 --ignore-scripts</text>
    <rect x="1134" y="995" width="190" height="46" rx="8" fill="url(#warm)"/>
    <text x="1229" y="1024" text-anchor="middle" fill="#171714" font-size="17" font-weight="700">复制安全命令</text>

    <text x="78" y="1078" class="mono muted" font-size="13">扫描于 08/29 18:00</text>
    <text x="1348" y="1078" text-anchor="end" class="mono muted" font-size="13">npm 完整性已验证</text>
  </g>
</svg>
