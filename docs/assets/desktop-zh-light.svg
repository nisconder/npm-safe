    <rect x="270" y="682" width="970" height="58" rx="14" fill="#f1f5f9"/>
    <text x="294" y="718" font-size="15" fill="#475569" font-family="'SF Mono',Consolas,monospace">npm install @npm-safe/core@2.0.1</text>
    <rect x="1080" y="694" width="136" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1148" y="716" font-size="13" fill="#64748b" text-anchor="middle">复制 · 不执行</text>
  </g>
