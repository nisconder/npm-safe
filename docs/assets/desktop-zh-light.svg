    <rect x="40" y="104" width="210" height="636" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <g font-size="15" fill="#64748b">
      <text x="64" y="146">总览</text>
      <rect x="52" y="166" width="186" height="40" rx="10" fill="#eff6ff"/>
      <text x="64" y="192" fill="#1d4ed8" font-weight="700">检查</text>
