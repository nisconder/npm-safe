      <text x="64" y="364">LLM</text>
      <text x="64" y="406">设置</text>
    </g>
    <rect x="270" y="104" width="970" height="88" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="294" y="140" font-size="15" fill="#64748b">包名</text>
    <text x="294" y="170" font-size="18" font-weight="700" fill="#0f172a" font-family="'SF Mono',Consolas,monospace">@npm-safe/core</text>
    <rect x="560" y="126" width="120" height="44" rx="10" fill="#f1f5f9"/>
    <text x="620" y="154" font-size="15" fill="#475569" text-anchor="middle" font-family="'SF Mono',Consolas,monospace">2.0.1</text>
    <rect x="1060" y="126" width="156" height="44" rx="10" fill="#2563eb"/>
    <text x="1138" y="154" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">源码复核</text>
    <rect x="270" y="212" width="470" height="250" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="294" y="252" font-size="15" fill="#047857">LLM 源码复核</text>
    <text x="294" y="308" font-size="40" font-weight="700" fill="#059669">benign</text>
    <text x="294" y="344" font-size="15" fill="#475569">在所提供的源码视图中未发现恶意行为。</text>
    <rect x="294" y="376" width="150" height="40" rx="20" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="369" y="402" font-size="14" fill="#047857" text-anchor="middle">已完成</text>
    <rect x="456" y="376" width="150" height="40" rx="20" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="531" y="402" font-size="14" fill="#047857" text-anchor="middle">2 次模型调用</text>
    <rect x="760" y="212" width="480" height="250" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="784" y="252" font-size="15" font-weight="700" fill="#0f172a">证据覆盖</text>
    <g font-size="14" fill="#64748b">
      <text x="784" y="292">初始摘录</text>
