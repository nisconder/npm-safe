    <text x="784" y="436" font-size="13" fill="#94a3b8">仅为受限视图——遗漏会在报告中披露。</text>
    <rect x="270" y="482" width="970" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="294" y="520" font-size="15" font-weight="700" fill="#0f172a">静态扫描（与模型结论相互独立）</text>
    <rect x="294" y="544" width="640" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="294" y="544" width="620" height="12" rx="6" fill="#10b981"/>
    <text x="958" y="556" font-size="16" font-weight="700" fill="#059669" font-family="'SF Mono',Consolas,monospace">97/100 · safe</text>
