<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-label="npm-safe 桌面界面示意：源码复核完成，结论为 benign，两次模型调用与受限证据覆盖">
  <rect width="1280" height="780" rx="20" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="1279" height="779" rx="19.5" fill="none" stroke="#e2e8f0"/>
